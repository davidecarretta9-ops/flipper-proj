name: Build BLE Test (official 1.5.1)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uFBT
        run: python -m pip install --upgrade ufbt

      - name: Select Flipper 1.5.1 SDK
        run: ufbt update --branch=1.5.1

      - name: Compile FAP
        run: ufbt

      - name: Upload compiled FAP
        uses: actions/upload-artifact@v4
        with:
          name: BLE-Test-FW-1.5.1
          path: dist/*.fap
          if-no-files-found: error
