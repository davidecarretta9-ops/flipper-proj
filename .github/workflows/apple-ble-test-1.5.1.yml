name: Apple BLE Test 2.0 - OFW 1.5.1

on:
  workflow_dispatch:
  push:
    paths:
      - 'apple-ble-test-1.5.1/**'
      - '.github/workflows/apple-ble-test-1.5.1.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uFBT
        run: python -m pip install --upgrade ufbt
      - name: Fetch SDK for official firmware 1.5.1
        working-directory: apple-ble-test-1.5.1
        run: ufbt update --branch=1.5.1
      - name: Compile
        working-directory: apple-ble-test-1.5.1
        run: ufbt
      - name: Upload FAP
        uses: actions/upload-artifact@v4
        with:
          name: Apple-BLE-Test-Official-1.5.1
          path: apple-ble-test-1.5.1/dist/*.fap
          if-no-files-found: error
