name: Android Popup Demo

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-popup-demo/**'
      - '.github/workflows/android-popup-demo.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: android-popup-demo
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FlipperLab-Android-Popup-Demo
          path: android-popup-demo/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
