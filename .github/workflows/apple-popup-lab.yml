name: Build Apple Popup Lab (official 1.5.1)

on:
  push:
    paths:
      - 'apple-popup-lab/**'
      - '.github/workflows/apple-popup-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade ufbt
      - name: Select SDK 1.5.1
        working-directory: apple-popup-lab
        run: ufbt update --branch=1.5.1
      - name: Compile FAP
        working-directory: apple-popup-lab
        run: ufbt
      - uses: actions/upload-artifact@v4
        with:
          name: Apple-Popup-Lab-1.5.1
          path: apple-popup-lab/dist/*.fap
          if-no-files-found: error
